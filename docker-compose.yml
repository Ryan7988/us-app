name: us-app

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  tailscale:
    <<: *common
    image: tailscale/tailscale:v1.90.6
    hostname: ${TS_HOSTNAME:-us-app}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: ${TS_USERSPACE:-false} # Docker Desktop（Mac/Windows）若無法建立 tun，改成 true
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./deploy/tailscale:/config:ro
    devices: ["/dev/net/tun:/dev/net/tun"]
    cap_add: [net_admin, sys_module]

  web:
    <<: *common
    build: { context: ., dockerfile: apps/web/Dockerfile }
    network_mode: service:tailscale # 和 tailscale 共用網路，不對外開 port
    volumes:
      - ./data/caddy:/data
      - ./data/media:/data/media:ro
    depends_on:
      api: { condition: service_healthy }

  api:
    <<: *common
    build: { context: apps/api }
    image: us-app-api
    env_file: .env
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      MEDIA_ROOT: /app/data/media
      BACKUP_STATUS_DIR: /app/data/backup-status
    volumes:
      - ./data/db:/app/data/db
      - ./data/media:/app/data/media
      - ./data/backup-status:/app/data/backup-status:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s

  worker:
    <<: *common
    image: us-app-api # 和 api 共用映像，不重複 build
    pull_policy: never
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      RUN_MIGRATIONS: "0" # 只有 api 跑 migration
      MEDIA_ROOT: /app/data/media
      BACKUP_STATUS_DIR: /app/data/backup-status
    volumes:
      - ./data/db:/app/data/db
      - ./data/media:/app/data/media
      - ./data/backup-status:/app/data/backup-status:ro
    depends_on:
      api: { condition: service_healthy } # 等 api 做完 migration

  ollama:
    <<: *common
    image: ollama/ollama:0.12.6 # 模型在後台按「下載 AI 模型」
    volumes:
      - ./data/ollama:/root/.ollama

  backup:
    <<: *common
    build: { context: deploy/backup }
    env_file: .env
    volumes:
      - ./data/db:/source/db:ro
      - ./data/media:/source/media:ro
      - ./data/backup-status:/status
      - ${BACKUP_TARGET:-./backups}:/repo
