# 開發用：後端 hot reload + Vite dev server（http://localhost:5173，手機在同網段可用 http://<電腦IP>:5173）
# docker compose -f docker-compose.dev.yml up
name: us-app-dev

services:
  api:
    build: { context: apps/api }
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: sqlite:////app/data/db/app.sqlite3
      COOKIE_SECURE: "false"
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/alembic:/app/alembic
      - ./data-dev/db:/app/data/db
      - ./data-dev/media:/app/data/media
    ports: ["8000:8000"]

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"
    environment:
      API_PROXY: http://api:8000
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  web_node_modules:
